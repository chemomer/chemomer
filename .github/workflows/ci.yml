name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: chemomer/inchi-tests
          path: .inchi-tests
          ref: v0.3.30
      - run: echo "INCHI_TESTS=$(pwd)/.inchi-tests" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: M1 formula-layer gate against the oracle corpus
        run: cargo test --locked

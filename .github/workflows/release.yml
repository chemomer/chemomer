# Release pipeline for chemomer
#
# Publishing to crates.io via release-plz. It does NOT create release
# PRs on its own here: releases publish directly when changes land on
# main (conventional commits drive the version bumps; see
# release-plz.toml). Mirrors the parsanol-rs pipeline.
#
# Credentials: NONE stored. The publish uses crates.io trusted
# publishing — cargo (≥1.89) running in GitHub Actions with
# `id-token: write` and no registry token exchanges the job's OIDC
# token against the publisher registered on the crate's settings page
# (repository chemomer/chemomer, workflow release.yml). release-plz's
# bookkeeping (PRs, GitHub releases) uses the workflow's own
# GITHUB_TOKEN — the permissions block grants what it needs.

name: Release

permissions:
  pull-requests: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - main

# Serialize runs: overlapping release-plz invocations race — one
# publishes while another, reading a pre-merge snapshot, opens a
# duplicate release PR. Queued runs start from the post-merge state.
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

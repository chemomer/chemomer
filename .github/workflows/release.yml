# Release pipeline for chemomer
#
# Publishing to crates.io via release-plz. It does NOT create release
# PRs on its own here: releases publish directly when changes land on
# main (conventional commits drive the version bumps; see
# release-plz.toml). Mirrors the parsanol-rs pipeline.
#
# Secrets required (org or repo):
#   CHEMOMER_CI_PAT_TOKEN — a PAT with repo/PR rights for the release
#     PRs and GitHub releases release-plz opens.
#   CARGO_REGISTRY_TOKEN — a crates.io token with publish-rights for
#     the `chemomer` crate (or switch to trusted publishing, see the
#     repo docs).

name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

# Serialize runs: overlapping release-plz invocations race — one
# publishes while another, reading a pre-merge snapshot, opens a
# duplicate release PR. Queued runs start from the post-merge state.
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip until credentials exist
        # CI stays green before the publish credentials are configured:
        # the workflow is a no-op until both secrets exist, then takes
        # over automatically.
        id: credentials
        run: |
          if [ -n "${{ secrets.CHEMOMER_CI_PAT_TOKEN }}" ] && [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release credentials not configured — skipping (add CHEMOMER_CI_PAT_TOKEN and CARGO_REGISTRY_TOKEN)."
          fi

      - name: Install Rust toolchain
        if: steps.credentials.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        if: steps.credentials.outputs.ready == 'true'
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.CHEMOMER_CI_PAT_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

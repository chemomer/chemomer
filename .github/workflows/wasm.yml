# The engine's wasm feature — build and smoke-test only.
#
# Dispatch-only: nothing runs on push or PR. A dispatch builds the
# engine's own `--features wasm` surface (wasm-pack, target nodejs)
# and runs the Node-side smoke test.
#
# npm distribution does NOT happen here: the published `chemomer`
# package on npm is the universal wasm build from chemomer/chemomer-ts
# (its trusted publisher: repository chemomer/chemomer-ts, workflow
# npm.yml). Publishing the crate-named pkg/ from this repo would
# collide with that package, so this workflow only verifies the build.

name: wasm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: wasm-pack build --target nodejs --out-dir pkg --features wasm
      - run: node scripts/smoke-wasm.mjs

[package]
name = "chemomer"
version = "1.1.0"
edition = "2021"
description = "Native Rust InChI engine, gated by the shared inchi-tests oracle corpus"
license = "MIT"
repository = "https://github.com/chemomer/chemomer"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
# Runtime bindings — the wasm feature gates its own dependency tree;
# the core stays dependency-free. (Python ships from
# chemomer/chemomer-py, Node from chemomer/chemomer-ts.)
wasm = ["dep:wasm-bindgen"]

[dependencies]
# The ONE parse dependency: the scanners (molfile, the InChI layers,
# RInChI) run the compiled PARG artifacts in grammar/ on parsanol's
# portable engine — the ecosystem's parsanol pattern (the same pin
# asciichem-rs carries).
parsanol = "0.18.9"
# Runtime bindings — the wasm feature gates its own dependency tree;
# the core stays dependency-free. (Python ships from
# chemomer/chemomer-py, Node from chemomer/chemomer-ts.)
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1.0"
proptest = "1.5"
criterion = "0.5"

[[bench]]
name = "identity"
harness = false

# wasm-pack's wasm-opt needs a binaryen download that fails in CI
# (the pinned release URL is dead); the pass is not load-bearing for
# the engine's wasm smoke build. Mirrors chemomer-ts, which ships
# the actual npm wasm package.
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

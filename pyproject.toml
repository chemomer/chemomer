[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "chemomer"
version = "0.1.0"
description = "Native Rust InChI engine — molfile in, identifier / AuxInfo / InChIKey out (the pyo3 binding, feature `pyo3`)"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["inchi", "inchikey", "chemistry", "cheminformatics"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Repository = "https://github.com/chemomer/chemomer"

[tool.maturin]
# The extension-module side of pyo3: the wheel never links libpython
# (the interpreter supplies it), so the artifact stays portable.
features = ["pyo3/extension-module"]
module-name = "chemomer"
